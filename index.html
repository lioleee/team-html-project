<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StartUp helps businesses grow with simple digital solutions.">
  <title>StartUp | Grow Your Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8fafc;
      color: #334155;
      margin: 0;
      line-height: 1.6;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 24px 20px;
    }

    header h2 {
      margin: 0;
      letter-spacing: 1px;
    }

    main {
      padding: 55px 20px;
    }

    h1 {
      color: #0f766e;
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    main > p {
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    section {
      background: white;
      max-width: 600px;
      margin: 40px auto 0;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
    }

    section h2 {
      color: #0f766e;
      margin-top: 10px;
    }

    ul {
      display: inline-block;
      text-align: left;
      line-height: 2;
      padding-left: 25px;
    }

    button {
      background: #0f766e;
      color: white;
      padding: 12px 26px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #115e59;
      transform: translateY(-2px);
    }

    footer {
      background: #0f172a;
      color: white;
      padding: 18px;
    }

    footer p {
      margin: 0;
    }

    @media (max-width: 600px) {
      main {
        padding: 35px 15px;
      }

      h1 {
        font-size: 1.8rem;
      }

      main > p {
        font-size: 1rem;
      }

      section {
        padding: 20px;
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>StartUp</h2>
  </header>

  <main>
    <h1>Grow Your Business</h1>
    <p>We help businesses succeed with simple digital solutions.</p>
    <button type="button">Get Started</button>

    <section>
      <h2>About Me</h2>
      <p>Hello, I'm Alisha!</p>
      <p>
        I'm a Software Engineering student learning
        web development and GitHub collaboration.
      </p>

      <h2>My Interests</h2>
      <ul>
        <li>Programming</li>
        <li>Web Development</li>
        <li>Artificial Intelligence</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StartUp</p>
  </footer>
</body>
</html>
