
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartUp</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      transition: 0.3s;
    }

    header {
      background: #1e293b;
      color: white;
      padding: 20px;
    }

    main {
      padding: 50px 20px;
    }

    h1 {
      color: #0f766e;
    }

    button {
      background: #0f766e;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #115e59;
    }

    footer {
      background: #1e293b;
      color: white;
      padding: 15px;
    }

    /* Dark Theme */
    body.dark {
      background: #0f172a;
      color: white;
    }

    body.dark h1 {
      color: #5eead4;
    }

    #message {
      margin-top: 20px;
      color: #0f766e;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h2>StartUp</h2>
    <button onclick="toggleTheme()">Toggle Theme</button>
  </header>

  <main>
    <h1>Grow Your Business</h1>

    <p>
      We help businesses succeed with simple digital solutions.
    </p>

    <button onclick="getStarted()">Get Started</button>

    <p id="message"></p>
  </main>

  <footer>
    <p id="footerText"></p>
  </footer>

  <script>
    // Display a welcome message when Get Started is clicked
    function getStarted() {
      document.getElementById("message").textContent =
        "Thank you for your interest in StartUp!";
    }

    // Switch between light and dark themes
    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    // Display the current year automatically
    document.getElementById("footerText").textContent =
      "© " + new Date().getFullYear() + " StartUp";
  </script>

</body>
</html>
